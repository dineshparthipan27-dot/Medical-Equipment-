<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>404 - Page Not Found | MediGear</title>

     
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

     
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary-blue: #0ea5e9;
            --accent-orange: #f97316;
            --bg-light: #f8fafc;
            --text-dark: #0f172a;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

         
        .error-container {
            text-align: center;
            padding: 40px 20px;
            max-width: 600px;
            width: 100%;
        }

         
        .error-icon {
            font-size: 5rem;
            color: var(--accent-orange);
            margin-bottom: 10px;
            display: inline-block;
            animation: floatUpDown 3s ease-in-out infinite;
            filter: drop-shadow(0 10px 15px rgba(249, 115, 22, 0.2));
        }

        @keyframes floatUpDown {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

         
        .error-code {
            font-size: 8rem;
            font-weight: 900;
            line-height: 1;
            color: var(--text-dark);
            margin-bottom: 10px;
            letter-spacing: -5px;
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .error-code span {
            color: var(--primary-blue);
        }

         
        .error-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 15px;
            animation: fadeInUp 0.6s ease-out 0.2s forwards;
            opacity: 0;
        }

        .error-desc {
            font-size: 1.15rem;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 40px;
            animation: fadeInUp 0.6s ease-out 0.4s forwards;
            opacity: 0;
        }

         
        .error-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            animation: fadeInUp 0.6s ease-out 0.6s forwards;
            opacity: 0;
        }

         
        .btn-solid,
        .btn-outline {
            cursor: pointer;
            font-weight: 700;
            font-size: 1.1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 32px;
            text-decoration: none;
            border-radius: 0;
             
            transition: all 0.3s ease;
        }

         
        .btn-solid {
            background-color: var(--primary-blue);
            color: #ffffff;
            border: none;
            box-shadow: 4px 4px 0 rgba(14, 165, 233, 0.2);
        }

        .btn-solid:hover {
            background-color: var(--accent-orange);
            box-shadow: 4px 4px 0 rgba(249, 115, 22, 0.2);
            transform: translateY(-3px);
        }

         
        .btn-outline {
            background-color: transparent;
            color: var(--text-dark);
            border: 2px solid var(--text-dark);
        }

        .btn-outline:hover {
            background-color: var(--text-dark);
            color: #ffffff;
            box-shadow: 4px 4px 0 rgba(15, 23, 42, 0.2);
            transform: translateY(-3px);
        }

         
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

         
        @media screen and (max-width: 600px) {
            .error-code {
                font-size: 6rem;
                letter-spacing: -2px;
            }

            .error-title {
                font-size: 1.6rem;
            }

            .error-desc {
                font-size: 1.05rem;
                margin-bottom: 30px;
            }

            .error-actions {
                flex-direction: column;
                gap: 15px;
            }

            .btn-solid,
            .btn-outline {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="error-container">

         
        <div class="error-icon">
            <i class="fa-solid fa-heart-crack"></i>
        </div>

         
        <h1 class="error-code">40<span>4</span></h1>
        <h2 class="error-title">Oops! Connection Lost.</h2>

        <p class="error-desc">
            It looks like you've wandered into an restricted ward. The page you are looking for has been moved, removed,
            or doesn't exist.
        </p>

         
        <div class="error-actions">
             
            <button onclick="goBack()" class="btn-outline">
                <i class="fa-solid fa-arrow-left"></i> Go Back
            </button>

             
            <a href="index.html" class="btn-solid">
                <i class="fa-solid fa-house-medical"></i> Back to Home
            </a>
        </div>

    </div>

     
    <script>
        function goBack() {
 
            if (window.history.length > 1) {
                window.history.back();
            } else {
 
                window.location.href = 'index.html';
            }
        }
    </script>

</body>

</html>
